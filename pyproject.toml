[project]
name = "wtf-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aarshbharat", email = "aarshbharat@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=6.0.1",
    "uvicorn>=0.52.4",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
wtf-rag = "wtf_rag:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
